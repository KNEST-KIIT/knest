# Local development database. Mirrors the RDS Postgres 16 used in AWS.
services:
  postgres:
    image: postgres:16-alpine
    container_name: knest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knest
      POSTGRES_PASSWORD: knest
      POSTGRES_DB: knest
    ports:
      - '5432:5432'
    volumes:
      - knest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knest -d knest']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knest-pgdata:
