name: Release image

# Builds the arm64 production image, pushes it to the private ECR repository, and
# deploys that exact digest to the environment's host. Manual only: it never runs on
# a push. It uses short-lived AWS credentials from GitHub's OIDC token, so no AWS key
# is stored in GitHub. The AWS roles trust only this repository and only a job that
# GitHub has attached to the Environment named below (infra/cfn/ci.yaml); for
# `production` the Environment must carry required reviewers, so a person approves
# every production deploy.
#
# One-time setup per Environment (s1, production), in GitHub > Settings > Environments:
#   variables  AWS_REGION            ap-south-1
#              AWS_PUSH_ROLE_ARN     output PushRoleArn of the ci stack
#              AWS_DEPLOY_ROLE_ARN   output DeployRoleArn of the ci stack
#              ECR_REPOSITORY        knest-app
# Nothing here is a secret; a role ARN grants nothing without the OIDC trust.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [s1, production]
        required: true
      deploy:
        description: Deploy after pushing (otherwise only build and push)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build, scan and push (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      app_image: ${{ steps.refs.outputs.app_image }}
      migrate_image: ${{ steps.refs.outputs.migrate_image }}
    steps:
      - name: Check the Environment is configured
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_PUSH_ROLE_ARN: ${{ vars.AWS_PUSH_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          for v in AWS_REGION AWS_PUSH_ROLE_ARN ECR_REPOSITORY; do
            if [ -z "${!v}" ]; then echo "::error::Environment variable $v is not set for ${{ inputs.environment }}"; exit 1; fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Scan the source for secrets
        run: node scripts/scan-secrets.mjs

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: knest-release-${{ github.run_id }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Tags are immutable in the repository (a retag is refused); the deploy uses the digests.
      - id: app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:app-${{ github.sha }}

      - id: migrate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrate
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:migrate-${{ github.sha }}

      - id: refs
        run: |
          echo "app_image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.app.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "migrate_image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.migrate.outputs.digest }}" >> "$GITHUB_OUTPUT"
          {
            echo "### Image digests for ${{ github.sha }}"
            echo "- app: \`${{ steps.app.outputs.digest }}\`"
            echo "- migrate: \`${{ steps.migrate.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy digest (${{ inputs.environment }})
    if: ${{ inputs.deploy }}
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the Environment is configured
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then echo "::error::AWS_DEPLOY_ROLE_ARN is not set for ${{ inputs.environment }}"; exit 1; fi

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: knest-deploy-${{ github.run_id }}

      - name: Run the deploy document on the host
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APP_IMAGE: ${{ needs.build-and-push.outputs.app_image }}
          MIGRATE_IMAGE: ${{ needs.build-and-push.outputs.migrate_image }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "knest-${ENVIRONMENT}-deploy" \
            --targets "Key=tag:knest-deploy-target,Values=${ENVIRONMENT}" \
            --parameters "Environment=${ENVIRONMENT},AppImage=${APP_IMAGE},MigrateImage=${MIGRATE_IMAGE}" \
            --comment "release ${GITHUB_SHA}" \
            --query Command.CommandId --output text)
          echo "command $COMMAND_ID"
          # The invocation record appears a moment after the command is accepted.
          INSTANCE_ID=None
          for i in $(seq 1 12); do
            INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].InstanceId' --output text)
            [ "$INSTANCE_ID" != "None" ] && break
            sleep 5
          done
          if [ "$INSTANCE_ID" = "None" ]; then echo "::error::no host answered the deploy command (is the instance tagged knest-deploy-target=${ENVIRONMENT} and online in SSM?)"; exit 1; fi
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,output:StandardOutputContent,errors:StandardErrorContent}' --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          [ "$STATUS" = "Success" ]
