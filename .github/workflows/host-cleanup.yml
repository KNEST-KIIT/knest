name: Host disk cleanup

# Frees disk space on the app host by removing container images and build cache that no container uses.
# Running containers, their images, volumes and the database are never touched.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production]
        required: true
        default: production

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Free disk space (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: knest-cleanup-${{ github.run_id }}

      - name: Prune unused images and build cache on the host
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:knest-deploy-target,Values=${ENVIRONMENT}" \
            --parameters 'commands=["df -h / /var/lib/docker 2>/dev/null","docker system df","docker image prune -a -f","docker builder prune -a -f","docker system df","df -h / /var/lib/docker 2>/dev/null"]' \
            --comment "host disk cleanup" \
            --query Command.CommandId --output text)
          echo "command $COMMAND_ID"
          INSTANCE_ID=None
          for i in $(seq 1 12); do
            INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].InstanceId' --output text)
            [ "$INSTANCE_ID" != "None" ] && break
            sleep 5
          done
          if [ "$INSTANCE_ID" = "None" ]; then echo "::error::no host answered the cleanup command"; exit 1; fi
          for j in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
            echo "Current status: $STATUS ($j/60)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '{status:Status,output:StandardOutputContent,errors:StandardErrorContent}' --output json
                [ "$STATUS" = "Success" ] && exit 0 || exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::cleanup timed out"
          exit 1
