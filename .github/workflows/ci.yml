name: CI

# Verification only. This workflow never deploys, never touches a real database and
# holds no cloud credentials. Its Postgres is a throwaway service container.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # `next build` inlines NEXT_PUBLIC_* values; none of these are secrets.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  AUTH_URL: http://localhost:3000
  AUTH_TRUST_HOST: 'true'
  AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
  PAYLOAD_SECRET: ci-only-payload-secret-0123456789abcdef012345
  FEATURE_LAB_BOOKING: 'false'

jobs:
  static:
    name: Lint, typecheck, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (includes the content-honesty gate)
        run: pnpm test

      # Fails on any advisory of moderate severity or above in runtime dependencies,
      # except the two documented, un-patchable ones listed in pnpm-workspace.yaml.
      - name: Security audit
        run: pnpm audit --prod --audit-level=moderate

  integration:
    name: Build, migrate from zero, integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The suite refuses any database whose name does not end in _test or whose
      # host is not loopback/postgres (tests/support/pg.ts).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/knest_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/knest_test
      PW_CHANNEL: chrome # preinstalled on GitHub's Ubuntu runners
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      # Starts from an EMPTY database: Drizzle migrations for `app`, Payload migrations
      # for `cms`, then the production build, then the tests. Also fails if a collection
      # changed without a committed Payload migration.
      - name: Integration tests
        run: pnpm test:integration
