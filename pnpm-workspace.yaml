# pnpm 10 reads settings from here, not from package.json's "pnpm" field
# (the old block was silently ignored; see KN-27).
overrides:
  # pg pin that package.json's ignored "pnpm.overrides" was meant to enforce
  pg: 8.23.0
  '@types/pg': 8.23.1
  # Transitive advisories that the Payload 3.90.x line still pulls in (KN-03 / NF-01).
  # Each range is the first patched release of the same major line.
  'undici@<7.30.1': '>=7.30.1 <8'
  'fast-uri@<3.1.9': '>=3.1.9 <4'
  'dompurify@<3.4.17': '>=3.4.17 <4'
  'happy-dom@<21.0.4': '>=21.0.4 <22'
  'source-map-js@<1.2.2': '>=1.2.2 <2'
  'fast-copy@<3.1.0': '>=3.1.0'
  # GHSA-x8rm-f576-gq67: @payloadcms/graphql pins 1.22.2 exactly and only imports DateTimeResolver/EmailAddressResolver;
  # the first patched release is 2.0.1 (same exports, graphql ^16 peer).
  'graphql-scalars@<2.0.1': '>=2.0.1 <3'
  # Zod advisory: lighthouse -> puppeteer-core -> chromium-bidi pins zod 3.25.x (<4.6.6). Scoped to
  # that one parent so no other zod range moves; the direct zod ^4.6.6 dependency is already patched.
  'chromium-bidi>zod': '>=4.6.6 <5'

# Advisories accepted on purpose (KN-03). Each is reached only through build/dev
# tooling, not a request path, and has no compatible patched route through its
# current upstream dependency. Anything else fails CI.
auditConfig:
  ignoreGhsas:
    # braces: ReDoS on deeply nested glob patterns; sass -> chokidar file watching. Unpatched upstream.
    - GHSA-vfj7-8cjw-p6xm
    # esbuild: dev-server request exposure; via drizzle-kit's legacy esbuild-kit loader.
    - GHSA-67mh-4wv8-2f99
