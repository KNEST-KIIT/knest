AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  KNEST application stack for ONE environment (the disposable S-1 spike, or
  production): VPC with a public subnet for the host and two private subnets for the
  database, EC2 (Graviton) running the container, private RDS PostgreSQL 16 with a
  managed master password, an S3 bucket for CMS media, the document-screening pipeline (a quarantine bucket,
  GuardDuty Malware Protection for S3, an EventBridge rule and SQS queue for results, a separate versioned
  bucket for clean documents, one KMS key), the generated origin-verification secret, log group, an instance role with no stored keys, and
  an SSM document that deploys an image by digest. DEPLOY IN ap-south-1. STATUS:
  written, not deployed, not validated by CloudFormation. Production differs from
  S-1 in its retention policy and inbound path: production accepts traffic only
  through the HTTPS load balancer in origin.yaml. Retention variants are produced
  from this file by scripts/render-cfn.mjs.

Parameters:
  Environment:
    Type: String
    AllowedValues: [s1, production]
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-south-1a
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-south-1b
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    # The subnets are cut as four /24 blocks (Fn::Cidr with 8 host bits), which needs a /16.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/16$'
    ConstraintDescription: Must be an IPv4 /16 block, for example 10.20.0.0/16.
  InstanceType:
    Type: String
    Default: t4g.small
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbEngineVersion:
    Type: String
    Default: '16.11'
    # A bare major ('16') and 16.1 to 16.8 are flagged deprecated for new instances; pin a
    # current minor. AutoMinorVersionUpgrade moves it forward within 16 afterwards.
    AllowedPattern: '^16\.[0-9]+$'
    Description: PostgreSQL 16 minor version (the parameter group family is postgres16).
  DbAllocatedStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 65536
  DbMultiAz:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  CloudFrontPrefixListId:
    Type: String
    Description: The AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing in ap-south-1 (look it up with ec2 describe-managed-prefix-lists).
  AppPort:
    Type: Number
    Default: 3000
    MinValue: 1024
    MaxValue: 65535
    Description: Host port used by the load balancer in production (CloudFront directly in S-1). The deploy document publishes container port 3000 on it.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  EcrRepositoryName:
    Type: String
    Default: knest-app
  SiteUrl:
    Type: String
    Description: Public address of the site, https only (SITE_URL). For private verification this is the distribution's *.cloudfront.net address.
  EmailFromAddress:
    Type: String
    Description: Address platform mail is sent from (an SES-verified identity).
    AllowedPattern: '^[^\s@<>]+@[^\s@<>]+$'
    ConstraintDescription: Must be a bare address such as no-reply@kiitnest.com (it is matched exactly by the ses:FromAddress condition).
  TurnstileSiteKey:
    Type: String
    Description: Cloudflare Turnstile site key (public by design; shown in every page). The matching secret key is pasted into the turnstile-secret Secrets Manager secret by the owner.
    AllowedPattern: '^[0-9A-Za-z_-]{5,}$'
    ConstraintDescription: Paste the site key from the Cloudflare dashboard (letters, digits, underscore, hyphen).
  FeatureLabBooking:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Switches lab booking on (FEATURE_LAB_BOOKING). Keep false until the lab operating policy (HD-16) is signed by the people responsible.
  SiteIndexing:
    Type: String
    Default: 'off'
    AllowedValues: ['on', 'off']
    Description: Lets search engines index the site (SITE_INDEXING). Keep off until the release manifest says otherwise.
  EnquiryNotifyEmail:
    Type: String
    Default: ''
    AllowedPattern: '^([^\s@<>]+@[^\s@<>]+)?$'
    ConstraintDescription: Empty, or a bare address. Empty means contact messages are stored but nobody is emailed.
    Description: Address that is emailed when someone sends a contact message (ENQUIRY_NOTIFY_EMAIL).
  LogRetentionDays:
    Type: Number
    Default: 1827
    Description: How long application logs stay in CloudWatch. Owner policy is five years of retention and then transfer to an approved backup and archive, so the default is 1827 days (five years, leap day included). CloudWatch only expires logs; it does not archive them, so the transfer after five years is a separate operating procedure (docs/delivery/RETENTION-ASSURANCE-2026-10-17.md). Lowering this below 1827 contradicts the published privacy policy.
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
  AlertEmail:
    Type: String
    Default: ''
    Description: Where alarm notifications go. Empty creates the topic without a subscriber.
  ExpiresOn:
    Type: String
    Default: ''
    Description: S-1 only. Informational tag (the stack is deleted by the scheduled teardown, not by this tag).

  ArchiveDocumentsAfterDays:
    Type: Number
    Default: 1827
    MinValue: 90
    Description: Owner policy is five years of retention and then transfer to an approved backup and archive. 1827 days is five years (leap day included). Applicant documents move to S3 Glacier Deep Archive after this many days and are never deleted by the template.
  ScanVolumeAlarmBytesPerDay:
    Type: Number
    Default: 5368709120
    MinValue: 1048576
    Description: Cost control. The alarm fires when GuardDuty scans more than this many bytes in a day (default 5 GiB, about 500 uploads of the 10 MB maximum).

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsMultiAz: !Equals [!Ref DbMultiAz, 'true']
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasEnquiryNotifyEmail: !Not [!Equals [!Ref EnquiryNotifyEmail, '']]

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub 'knest-${Environment}' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub 'knest-${Environment}-public' }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Select [3, !Cidr [!GetAtt Vpc.CidrBlock, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub 'knest-${Environment}-public-b' }]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub 'knest-${Environment}-private-a' }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Select [2, !Cidr [!GetAtt Vpc.CidrBlock, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub 'knest-${Environment}-private-b' }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  PublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet, RouteTableId: !Ref PublicRouteTable }
  PublicRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }
  # The private route table has only the local route: the database subnets cannot reach, or be reached from, the internet.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }
  PrivateRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App host. Production ingress is granted only to the HTTPS load balancer by origin.yaml; no SSH.
      VpcId: !Ref Vpc
      SecurityGroupIngress: !If
        - IsProduction
        - !Ref AWS::NoValue
        - - IpProtocol: tcp
            FromPort: !Ref AppPort
            ToPort: !Ref AppPort
            SourcePrefixListId: !Ref CloudFrontPrefixListId
            Description: S-1 only. CloudFront origin-facing addresses.
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'AWS APIs (SSM, ECR, S3, SES, Secrets Manager), Cloudflare Turnstile, Google sign-in' }
      Tags: [{ Key: Name, Value: !Sub 'knest-${Environment}-app' }]

  # A separate resource, not an inline egress rule: the database group's ingress already
  # names the app group, so naming the database group here inline would be a circular
  # dependency. Without this rule the app host's 443-only egress would block PostgreSQL.
  AppToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: PostgreSQL to the database only

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database. Inbound only from the app host.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup, Description: PostgreSQL from the app host }
      # Replace the default allow-all egress with a rule that matches nothing real.
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 127.0.0.1/32, Description: no outbound }
      Tags: [{ Key: Name, Value: !Sub 'knest-${Environment}-db' }]

  # ------------------------------------------------------------------ data
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets only
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: TLS required, slow-statement logging
      Family: postgres16
      Parameters:
        rds.force_ssl: '1'
        log_min_duration_statement: '1000'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot # DELETION
    UpdateReplacePolicy: Snapshot # DELETION
    Properties:
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorageGb
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !If [IsMultiAz, true, false]
      PubliclyAccessible: false
      DBName: knest
      MasterUsername: knest_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      DBParameterGroupName: !Ref DbParameterGroup
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '21:00-22:00'
      PreferredMaintenanceWindow: sun:22:30-sun:23:30
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: !If [IsProduction, true, false]
      DeleteAutomatedBackups: !If [IsProduction, false, true]
      EnableCloudwatchLogsExports: [postgresql]

  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain # DELETION
    UpdateReplacePolicy: Retain # DELETION
    Properties:
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      VersioningConfiguration: !If [IsProduction, { Status: Enabled }, !Ref 'AWS::NoValue']
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
          - !If
            - IsProduction
            - { Id: expire-old-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 90 } }
            - { Id: s1-expire-objects, Status: Enabled, ExpirationInDays: 1 }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  # ------------------------------------------------------- document screening
  # Every applicant upload lands in QuarantineBucket, which nobody can read until GuardDuty Malware Protection for
  # S3 has scanned THAT object version and tagged it clean (bucket policy below). The app then copies exactly that
  # version into DocumentsBucket (separate, versioned, kept five years and then archived) and records the outcome
  # in its database; a document is served only from there. Results reach the app as EventBridge events delivered to
  # an SQS queue the app polls over its instance role (no inbound endpoint). Design, limits and the hosted drill:
  # docs/delivery/MALWARE-PROTECTION-ARCHITECTURE-2026-10-27.md. Role names are fixed so policies can name them
  # without creating dependency cycles.

  # One customer-managed key for both document buckets. Only the app's instance role and GuardDuty's scan role can
  # use it for data (the deny below covers every other principal, administrators included); changing that needs a
  # key-policy edit, which CloudTrail records. Rotation is on.
  DocumentsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain # DELETION
    UpdateReplacePolicy: Retain # DELETION
    Properties:
      Description: !Sub 'KNEST ${Environment}: encrypts the quarantine and clean document buckets'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIamPoliciesToGrantAccess
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: OnlyTheAppAndTheScannerMayUseTheKeyOnData
            Effect: Deny
            Principal: '*'
            Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey', 'kms:GenerateDataKeyWithoutPlaintext', 'kms:ReEncryptFrom', 'kms:ReEncryptTo']
            Resource: '*'
            Condition:
              ArnNotEquals:
                'aws:PrincipalArn':
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/knest-${Environment}-ec2'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/knest-${Environment}-guardduty-malware'
  DocumentsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/knest-${Environment}-documents'
      TargetKeyId: !Ref DocumentsKey

  # Isolated holding area. Private, versioned (a verdict is bound to a version id), encrypted with the key above, and
  # unreadable by anyone but GuardDuty until a version is tagged NO_THREATS_FOUND. Whatever is left (rejected files,
  # leftovers) is removed by the lifecycle rules.
  QuarantineBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain # DELETION
    UpdateReplacePolicy: Retain # DELETION
    Properties:
      BucketName: !Sub 'knest-${Environment}-quarantine-${AWS::AccountId}'
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault: { SSEAlgorithm: 'aws:kms', KMSMasterKeyID: !GetAtt DocumentsKey.Arn }
      VersioningConfiguration: { Status: Enabled }
      # GuardDuty's managed rule listens to these events; enabling them here keeps the setting in the template.
      NotificationConfiguration: { EventBridgeConfiguration: { EventBridgeEnabled: true } }
      LifecycleConfiguration:
        Rules:
          - { Id: abort-incomplete-uploads, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 } }
          - { Id: expire-quarantined-objects, Status: Enabled, ExpirationInDays: !If [IsProduction, 14, 1], NoncurrentVersionExpiration: { NoncurrentDays: 1 } }
          - { Id: remove-lone-delete-markers, Status: Enabled, ExpiredObjectDeleteMarker: true }

  QuarantineBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref QuarantineBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt QuarantineBucket.Arn, !Sub '${QuarantineBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
          # The load-bearing control: no principal except GuardDuty can read a version that is not tagged clean, so an
          # unscanned, infected, skipped or failed object cannot be fetched, copied or served by anyone, whatever the app does.
          - Sid: NoReadUnlessScannedClean
            Effect: Deny
            Principal: '*'
            Action: ['s3:GetObject', 's3:GetObjectVersion']
            Resource: !Sub '${QuarantineBucket.Arn}/*'
            Condition:
              StringNotEquals: { 's3:ExistingObjectTag/GuardDutyMalwareScanStatus': NO_THREATS_FOUND }
              ArnNotEquals: { 'aws:PrincipalArn': !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/knest-${Environment}-guardduty-malware' }
          # Only GuardDuty writes the scan tag; nobody can mark an object clean by tagging it.
          - Sid: OnlyGuardDutyMayChangeTags
            Effect: Deny
            Principal: '*'
            Action: ['s3:PutObjectTagging', 's3:PutObjectVersionTagging', 's3:DeleteObjectTagging', 's3:DeleteObjectVersionTagging']
            Resource: !Sub '${QuarantineBucket.Arn}/*'
            Condition:
              ArnNotEquals: { 'aws:PrincipalArn': !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/knest-${Environment}-guardduty-malware' }
          # GuardDuty cannot scan customer-key (SSE-C) objects, so none may be written.
          - Sid: NoCustomerProvidedKeys
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${QuarantineBucket.Arn}/*'
            Condition: { 'Null': { 's3:x-amz-server-side-encryption-customer-algorithm': 'false' } }

  # The clean store: separate bucket, same key, versioned. A document is served from here only, at a recorded version.
  # Policy (owner-stated): kept five years, then moved to the archive tier (not deleted); superseded drafts are kept
  # 90 days for recovery. The archive destination is S3 Glacier Deep Archive in this account until KIIT approves another.
  # TransitionDefaultMinimumObjectSize: since September 2024 S3 does not transition objects under 128 KB to any class by
  # default. Applicant scans and photos are often that small, and the policy covers every document, so this opts in to
  # archiving them too (the S3 lifecycle documentation allows it for Glacier Flexible Retrieval and Deep Archive only).
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain # DELETION
    UpdateReplacePolicy: Retain # DELETION
    Properties:
      BucketName: !Sub 'knest-${Environment}-documents-${AWS::AccountId}'
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault: { SSEAlgorithm: 'aws:kms', KMSMasterKeyID: !GetAtt DocumentsKey.Arn }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        TransitionDefaultMinimumObjectSize: varies_by_storage_class
        Rules:
          - { Id: abort-incomplete-uploads, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 } }
          - !If
            - IsProduction
            - { Id: expire-superseded-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 90 } }
            - { Id: s1-expire-objects, Status: Enabled, ExpirationInDays: 1, NoncurrentVersionExpiration: { NoncurrentDays: 1 } }
          - !If
            - IsProduction
            - { Id: archive-after-five-years, Status: Enabled, Transitions: [{ StorageClass: DEEP_ARCHIVE, TransitionInDays: !Ref ArchiveDocumentsAfterDays }] }
            - !Ref 'AWS::NoValue'
          # S-1 only. The s1-expire-objects rule expires current versions by adding a delete marker, and a smoke test that deletes a
          # document does the same; once the noncurrent versions are gone the marker is all that is left, and it keeps the
          # bucket from being deleted with the stack (DELETE_FAILED). A rule that expires by days may not also set
          # ExpiredObjectDeleteMarker, hence a rule of its own. Production never gets it: nothing there is ever expired.
          - !If
            - IsProduction
            - !Ref 'AWS::NoValue'
            - { Id: s1-remove-lone-delete-markers, Status: Enabled, ExpiredObjectDeleteMarker: true }

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt DocumentsBucket.Arn, !Sub '${DocumentsBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  # GuardDuty's scan role. The permission set is the one AWS documents for a protection plan, narrowed to this one
  # bucket, this key and this account's managed rule. Trust is the GuardDuty service principal only.
  GuardDutyMalwareRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'knest-${Environment}-guardduty-malware'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: malware-protection-plan.guardduty.amazonaws.com }, Action: 'sts:AssumeRole' }]
  GuardDutyMalwarePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: scan-the-quarantine-bucket
      Roles: [!Ref GuardDutyMalwareRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowManagedRuleToSendS3EventsToGuardDuty
            Effect: Allow
            Action: ['events:PutRule', 'events:DeleteRule', 'events:PutTargets', 'events:RemoveTargets']
            Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*'
            Condition: { StringLike: { 'events:ManagedBy': malware-protection-plan.guardduty.amazonaws.com } }
          - Sid: AllowGuardDutyToMonitorEventBridgeManagedRule
            Effect: Allow
            Action: ['events:DescribeRule', 'events:ListTargetsByRule']
            Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*'
          - Sid: AllowPostScanTag
            Effect: Allow
            Action: ['s3:PutObjectTagging', 's3:GetObjectTagging', 's3:PutObjectVersionTagging', 's3:GetObjectVersionTagging']
            Resource: !Sub '${QuarantineBucket.Arn}/*'
          - Sid: AllowEnableS3EventBridgeEvents
            Effect: Allow
            Action: ['s3:PutBucketNotification', 's3:GetBucketNotification']
            Resource: !GetAtt QuarantineBucket.Arn
          - Sid: AllowPutValidationObject
            Effect: Allow
            Action: ['s3:PutObject']
            Resource: !Sub '${QuarantineBucket.Arn}/malware-protection-resource-validation-object'
          - Sid: AllowCheckBucketOwnership
            Effect: Allow
            Action: ['s3:ListBucket']
            Resource: !GetAtt QuarantineBucket.Arn
          - Sid: AllowMalwareScan
            Effect: Allow
            Action: ['s3:GetObject', 's3:GetObjectVersion']
            Resource: !Sub '${QuarantineBucket.Arn}/*'
          - Sid: AllowDecryptForMalwareScan
            Effect: Allow
            Action: ['kms:GenerateDataKey', 'kms:Decrypt']
            Resource: !GetAtt DocumentsKey.Arn
            Condition: { StringLike: { 'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com' } }

  # Scans every new object version in QuarantineBucket, tags it, and publishes the result to EventBridge. Tagging is on
  # because the bucket policy above and the app's corroboration step both rely on the tag. Standalone: GuardDuty
  # itself need not be enabled for this feature. Usage is billed per GB scanned and per object (see the cost plan).
  MalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    DependsOn: [GuardDutyMalwarePolicy, QuarantineBucketPolicy]
    Properties:
      Role: !GetAtt GuardDutyMalwareRole.Arn
      ProtectedResource: { S3Bucket: { BucketName: !Ref QuarantineBucket } }
      Actions: { Tagging: { Status: ENABLED } }
      Tags: [{ Key: Name, Value: !Sub 'knest-${Environment}-quarantine' }]

  # Scan results -> the app. Standard SQS with a dead-letter queue: nothing the app cannot settle is dropped.
  # maxReceiveCount: every wait the verdict worker makes (for a row, a scan tag, a working S3) is a retry, and every retry is
  # another receive. The worker doubles the delay each time (src/server/security/scan-retry.ts), so its longest deadline
  # (one hour) needs 10 receives; 12 leaves two to spare, and a message nothing can fix still reaches the dead-letter queue,
  # and the alarm, in under two hours. infra/cfn/malware-protection.test.ts keeps this number in step with that module.
  ScanResultDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'knest-${Environment}-scan-results-dlq'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  ScanResultQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'knest-${Environment}-scan-results'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 300
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy: { deadLetterTargetArn: !GetAtt ScanResultDeadLetterQueue.Arn, maxReceiveCount: 12 }
  ScanResultQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ScanResultQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyTheScanResultRuleMaySend
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: 'sqs:SendMessage'
            Resource: !GetAtt ScanResultQueue.Arn
            Condition: { ArnEquals: { 'aws:SourceArn': !GetAtt ScanResultRule.Arn } }
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt ScanResultQueue.Arn
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
  ScanResultDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ScanResultDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt ScanResultDeadLetterQueue.Arn
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
  ScanResultRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'knest-${Environment}-scan-results'
      Description: GuardDuty Malware Protection scan results for the quarantine bucket, delivered to the verdict queue.
      State: ENABLED
      EventPattern:
        source: ['aws.guardduty']
        detail-type: ['GuardDuty Malware Protection Object Scan Result']
        account: [!Ref 'AWS::AccountId']
        region: [!Ref 'AWS::Region']
        detail:
          s3ObjectDetails:
            bucketName: [!Ref QuarantineBucket]
      Targets:
        - Id: verdict-queue
          Arn: !GetAtt ScanResultQueue.Arn

  # Tell a person when the protection itself is unhealthy (a plan in ERROR or WARNING, or a failed post-scan action).
  GuardDutyStatusRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'knest-${Environment}-scan-plan-status'
      Description: The malware protection plan reports anything other than ACTIVE.
      State: ENABLED
      EventPattern:
        source: ['aws.guardduty']
        detail-type: [{ prefix: 'GuardDuty Malware Protection Resource Status' }]
        account: [!Ref 'AWS::AccountId']
        detail: { resourceStatus: [{ 'anything-but': 'ACTIVE' }] }
      Targets: [{ Id: alerts, Arn: !Ref AlertTopic }]
  GuardDutyPostScanRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'knest-${Environment}-scan-post-action-failed'
      Description: GuardDuty could not tag a scanned object.
      State: ENABLED
      EventPattern:
        source: ['aws.guardduty']
        detail-type: ['GuardDuty Malware Protection Post Scan Action Failed']
        account: [!Ref 'AWS::AccountId']
      Targets: [{ Id: alerts, Arn: !Ref AlertTopic }]
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # SNS's own default (account owner), kept so CloudWatch alarms can still publish.
          - Sid: AccountOwnerDefault
            Effect: Allow
            Principal: { AWS: '*' }
            Action: ['SNS:GetTopicAttributes', 'SNS:SetTopicAttributes', 'SNS:AddPermission', 'SNS:RemovePermission', 'SNS:DeleteTopic', 'SNS:Subscribe', 'SNS:ListSubscriptionsByTopic', 'SNS:Publish']
            Resource: !Ref AlertTopic
            Condition: { StringEquals: { 'AWS:SourceOwner': !Ref 'AWS::AccountId' } }
          - Sid: EventBridgeMayPublishScanHealth
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: 'sns:Publish'
            Resource: !Ref AlertTopic
            Condition: { ArnEquals: { 'aws:SourceArn': [!GetAtt GuardDutyStatusRule.Arn, !GetAtt GuardDutyPostScanRule.Arn] } }

  # What the app's instance role may do with documents, and nothing else: write to quarantine, read back only versions
  # the bucket policy already shows are clean, write and read the clean bucket, use the key through S3, and consume
  # the verdict queue. It cannot tag, cannot permanently delete clean documents, and cannot reach any other bucket.
  InstanceDocumentsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: documents-and-screening
      Roles: [!Ref InstanceRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: WriteUploadsToQuarantine
            Effect: Allow
            Action: ['s3:PutObject']
            Resource: !Sub '${QuarantineBucket.Arn}/*'
          - Sid: ReadAndRemoveScannedQuarantineVersions
            Effect: Allow
            Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:GetObjectTagging', 's3:GetObjectVersionTagging', 's3:DeleteObjectVersion']
            Resource: !Sub '${QuarantineBucket.Arn}/*'
          - Sid: CleanDocuments
            Effect: Allow
            Action: ['s3:PutObject', 's3:GetObject', 's3:GetObjectVersion', 's3:DeleteObject']
            Resource: !Sub '${DocumentsBucket.Arn}/*'
          - Sid: ListCleanDocuments
            Effect: Allow
            Action: ['s3:ListBucket']
            Resource: !GetAtt DocumentsBucket.Arn
          - Sid: UseTheDocumentsKeyThroughS3Only
            Effect: Allow
            Action: ['kms:GenerateDataKey', 'kms:Decrypt']
            Resource: !GetAtt DocumentsKey.Arn
            Condition: { StringEquals: { 'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com' } }
          - Sid: ConsumeScanVerdicts
            Effect: Allow
            Action: ['sqs:ReceiveMessage', 'sqs:DeleteMessage', 'sqs:ChangeMessageVisibility', 'sqs:GetQueueAttributes']
            Resource: !GetAtt ScanResultQueue.Arn

  # The token CloudFront adds to every request so the host can tell it came through the distribution.
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'knest-${Environment}/origin-verify'
      Description: Value of the X-Origin-Verify header (edge.yaml reads it by dynamic reference).
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # The database identity the web container runs as. The login role itself is created by the
  # migration job (src/db/runtime-role.ts) using this generated password, so the role that serves
  # requests can read and write rows but cannot change the schema. The master secret stays with
  # the migration step only.
  DbRuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'knest-${Environment}/db-runtime'
      Description: Credentials of the least-privilege database role the app runs as (created by the migration job).
      GenerateSecretString:
        SecretStringTemplate: '{"username":"knest_app"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true

  # The two session and CMS secrets, generated here so no person ever handles them.
  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'knest-${Environment}/auth-secret'
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }
  PayloadSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'knest-${Environment}/payload-secret'
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

  # Cloudflare Turnstile secret key. Created empty; the owner pastes the value in the console.
  TurnstileSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'knest-${Environment}/turnstile-secret'
      Description: Cloudflare Turnstile secret key (set by the owner; not generated).

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain # DELETION
    UpdateReplacePolicy: Retain # DELETION
    Properties:
      LogGroupName: !Sub '/knest-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  # ----------------------------------------------------------- host identity
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'knest-${Environment}-ec2'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: 'sts:AssumeRole' }]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DocumentsAndMedia
                Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject']
                Resource: !Sub '${Bucket.Arn}/*'
              - Sid: ListTheBucket
                Effect: Allow
                Action: ['s3:ListBucket']
                Resource: !GetAtt Bucket.Arn
              - Sid: SnapshotBeforeMigrating
                Effect: Allow
                Action: ['rds:CreateDBSnapshot', 'rds:DescribeDBSnapshots', 'rds:AddTagsToResource']
                Resource:
                  - !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${Database}'
                  - !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:snapshot:pre-migrate-*'
              - Sid: PullImages
                Effect: Allow
                Action: ['ecr:BatchGetImage', 'ecr:GetDownloadUrlForLayer', 'ecr:BatchCheckLayerAvailability']
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
              - Sid: EcrLogin
                Effect: Allow
                Action: 'ecr:GetAuthorizationToken'
                Resource: '*'
              - Sid: ReadOnlyItsOwnSecrets
                Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource:
                  - !Ref OriginVerifySecret
                  - !Ref AuthSecret
                  - !Ref PayloadSecret
                  - !Ref TurnstileSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref DbRuntimeSecret
              - Sid: ConfigurationParameters
                Effect: Allow
                Action: ['ssm:GetParameter', 'ssm:GetParameters', 'ssm:GetParametersByPath']
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/knest-${Environment}/*'
              - Sid: Logs
                Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogStreams']
                Resource: [!GetAtt LogGroup.Arn, !Sub '${LogGroup.Arn}:*']
              - Sid: SendMailFromTheConfiguredAddressOnly
                Effect: Allow
                Action: ['ses:SendEmail', 'ses:SendRawEmail']
                Resource: '*'
                Condition: { StringEquals: { 'ses:FromAddress': !Ref EmailFromAddress } }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'knest-${Environment}-ec2'
      Roles: [!Ref InstanceRole]

  # Non-secret settings the deploy document reads. Secrets stay in Secrets Manager.
  ConfigSiteUrl:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/site-url', Type: String, Value: !Ref SiteUrl }
  ConfigBucket:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/bucket', Type: String, Value: !Ref Bucket }
  ConfigDbEndpoint:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/db-endpoint', Type: String, Value: !GetAtt Database.Endpoint.Address }
  ConfigDbSecretArn:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/db-secret-arn', Type: String, Value: !GetAtt Database.MasterUserSecret.SecretArn }
  ConfigDbRuntimeSecretArn:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/db-runtime-secret-arn', Type: String, Value: !Ref DbRuntimeSecret }
  ConfigTurnstileSiteKey:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/turnstile-site-key', Type: String, Value: !Ref TurnstileSiteKey }
  ConfigFeatureLabBooking:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/feature-lab-booking', Type: String, Value: !Ref FeatureLabBooking }
  ConfigSiteIndexing:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/site-indexing', Type: String, Value: !Ref SiteIndexing }
  ConfigEnquiryNotifyEmail:
    Type: AWS::SSM::Parameter
    Condition: HasEnquiryNotifyEmail
    Properties: { Name: !Sub '/knest-${Environment}/config/enquiry-notify-email', Type: String, Value: !Ref EnquiryNotifyEmail }
  ConfigDbInstanceId:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/db-instance-id', Type: String, Value: !Ref Database }
  ConfigEmailFrom:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/email-from', Type: String, Value: !Ref EmailFromAddress }
  ConfigSecretIds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/knest-${Environment}/config/secret-ids'
      Type: String
      Value: !Sub 'knest-${Environment}/origin-verify,knest-${Environment}/auth-secret,knest-${Environment}/payload-secret'

  ConfigQuarantineBucket:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/quarantine-bucket', Type: String, Value: !Ref QuarantineBucket }
  ConfigDocumentsBucket:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/documents-bucket', Type: String, Value: !Ref DocumentsBucket }
  ConfigDocumentsKmsKeyArn:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/documents-kms-key-arn', Type: String, Value: !GetAtt DocumentsKey.Arn }
  ConfigMalwareScanQueueUrl:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub '/knest-${Environment}/config/malware-scan-queue-url', Type: String, Value: !Ref ScanResultQueue }

  # --------------------------------------------------------------- the host
  AppInstance:
    Type: AWS::EC2::Instance
    # The boot script downloads packages and the RDS CA bundle, so the default route (and with
    # it the gateway attachment) must exist before the instance starts.
    DependsOn: PublicDefaultRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref AppSecurityGroup]
      # IMDSv2 only; hop limit 2 so a container can reach the metadata service for the role credentials.
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker jq
          systemctl enable --now docker
          mkdir -p /opt/knest
          # The RDS certificate authority bundle, so the app can verify the database's TLS certificate.
          curl -fsS -o /opt/knest/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
      Tags:
        - { Key: Name, Value: !Sub 'knest-${Environment}-app' }
        - { Key: knest-deploy-target, Value: !Ref Environment }
        - { Key: expires, Value: !Ref ExpiresOn }

  # Deploys an image by digest: migrate, then (re)start the app. If the new container is not
  # healthy it is removed and the previous one is started again. Run from the pipeline with
  # SSM Run Command; nothing about it needs a person on the host.
  DeployDocument:
    Type: AWS::SSM::Document
    Properties:
      # A new version in place: without this a Content change replaces the document, which a custom name forbids.
      UpdateMethod: NewVersion
      DocumentType: Command
      Name: !Sub 'knest-${Environment}-deploy'
      Content:
        schemaVersion: '2.2'
        description: Deploy a KNEST image by digest (migrate, then restart; roll back if unhealthy).
        parameters:
          Environment:
            type: String
            default: !Ref Environment
          HostPort:
            type: String
            default: !Sub '${AppPort}'
            description: Host port the container is published on (must match the security group and the distribution origin port).
            allowedPattern: '^[0-9]{4,5}$'
          AppImage:
            type: String
            description: Full ECR URI of the app image, by digest (ends in @sha256:...). A tag is refused.
            allowedPattern: '^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'
          MigrateImage:
            type: String
            description: Full ECR URI of the migrate-target image built from the same commit, by digest.
            allowedPattern: '^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'
        mainSteps:
          - action: aws:runShellScript
            name: deploy
            inputs:
              timeoutSeconds: '900'
              runCommand:
                - |
                  set -euo pipefail
                  ENVIRONMENT="{{ Environment }}"
                  HOST_PORT="{{ HostPort }}"
                  APP_IMAGE="{{ AppImage }}"
                  MIGRATE_IMAGE="{{ MigrateImage }}"
                  TOKEN=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 120')
                  REGION=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
                  param() { aws ssm get-parameter --region "$REGION" --name "/knest-$ENVIRONMENT/config/$1" --query Parameter.Value --output text; }
                  secret() { aws secretsmanager get-secret-value --region "$REGION" --secret-id "$1" --query SecretString --output text; }

                  # Registry login for the image host (the instance role pulls; no stored credentials).
                  REGISTRY="${APP_IMAGE%%/*}"
                  aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY" >/dev/null

                  # Build the environment file in memory-backed storage, readable by root only.
                  DB_ENDPOINT=$(param db-endpoint)
                  SITE_URL=$(param site-url)
                  umask 077
                  mkdir -p /run/knest
                  # The environment files hold secrets: remove them however this script ends.
                  trap 'rm -f /run/knest/common.env /run/knest/migrate.env /run/knest/app.env' EXIT

                  # Two database identities. The migration job connects as the master user (it changes the
                  # schema) and creates the runtime role; the web container connects as that role, which can
                  # read and write rows and nothing else (src/db/runtime-role.ts).
                  MASTER_SECRET=$(secret "$(param db-secret-arn)")
                  MASTER_USER=$(echo "$MASTER_SECRET" | jq -r .username)
                  MASTER_PASSWORD=$(echo "$MASTER_SECRET" | jq -rj .password | jq -sRr @uri)
                  RUNTIME_ARN=$(param db-runtime-secret-arn)
                  [ -n "$RUNTIME_ARN" ] && [ "$RUNTIME_ARN" != "None" ] || { echo "runtime database secret is not configured; refusing deployment" >&2; exit 1; }
                  RUNTIME_SECRET=$(secret "$RUNTIME_ARN")
                  RUNTIME_USER=$(echo "$RUNTIME_SECRET" | jq -er .username)
                  RUNTIME_PASSWORD=$(echo "$RUNTIME_SECRET" | jq -er .password)
                  [ -n "$RUNTIME_USER" ] && [ -n "$RUNTIME_PASSWORD" ] || { echo "runtime database secret is incomplete; refusing deployment" >&2; exit 1; }

                  {
                    echo "NODE_ENV=production"
                    echo "DATABASE_SSL=verify"
                    echo "DATABASE_SSL_CA_FILE=/etc/knest/rds-global-bundle.pem"
                    echo "AUTH_SECRET=$(secret "knest-$ENVIRONMENT/auth-secret")"
                    echo "PAYLOAD_SECRET=$(secret "knest-$ENVIRONMENT/payload-secret")"
                    echo "ORIGIN_VERIFY_SECRET=$(secret "knest-$ENVIRONMENT/origin-verify")"
                    echo "SITE_URL=${SITE_URL}"
                    echo "AUTH_URL=${SITE_URL}"
                    echo "AUTH_TRUST_HOST=true"
                    echo "CLIENT_IP_SOURCE=cloudfront"
                    echo "TURNSTILE_SITE_KEY=$(param turnstile-site-key)"
                    echo "TURNSTILE_SECRET_KEY=$(secret "knest-$ENVIRONMENT/turnstile-secret")"
                    echo "S3_BUCKET=$(param bucket)"
                    echo "S3_REGION=${REGION}"
                    echo "QUARANTINE_BUCKET=$(param quarantine-bucket)"
                    echo "DOCUMENTS_BUCKET=$(param documents-bucket)"
                    echo "DOCUMENTS_KMS_KEY_ARN=$(param documents-kms-key-arn)"
                    echo "MALWARE_SCAN_QUEUE_URL=$(param malware-scan-queue-url)"
                    echo "EMAIL_TRANSPORT=ses"
                    echo "EMAIL_FROM=$(param email-from)"
                    echo "FEATURE_LAB_BOOKING=$(param feature-lab-booking)"
                    echo "SITE_INDEXING=$(param site-indexing)"
                    NOTIFY=$(param enquiry-notify-email 2>/dev/null || true)
                    [ -n "$NOTIFY" ] && echo "ENQUIRY_NOTIFY_EMAIL=$NOTIFY"
                  } > /run/knest/common.env
                  {
                    cat /run/knest/common.env
                    echo "DATABASE_URL=postgres://${MASTER_USER}:${MASTER_PASSWORD}@${DB_ENDPOINT}:5432/knest"
                    echo "DB_RUNTIME_USER=${RUNTIME_USER}"
                    echo "DB_RUNTIME_PASSWORD=${RUNTIME_PASSWORD}"
                  } > /run/knest/migrate.env

                  MOUNT="-v /opt/knest/rds-global-bundle.pem:/etc/knest/rds-global-bundle.pem:ro"
                  RUN_OPTS="--env-file /run/knest/app.env $MOUNT"
                  PREVIOUS=$(docker inspect knest 2>/dev/null | jq -r '.[0].Config.Image // empty' || true)

                  # Migrations only move forward, so take a restore point first and stop if it cannot be made.
                  SNAPSHOT="pre-migrate-$(date -u +%Y%m%d%H%M%S)"
                  echo "Snapshotting the database as $SNAPSHOT"
                  aws rds create-db-snapshot --region "$REGION" --db-instance-identifier "$(param db-instance-id)" --db-snapshot-identifier "$SNAPSHOT" >/dev/null
                  aws rds wait db-snapshot-available --region "$REGION" --db-snapshot-identifier "$SNAPSHOT"

                  echo "Migrating with $MIGRATE_IMAGE"
                  docker pull "$MIGRATE_IMAGE" >/dev/null
                  MIGRATE_LOG=$(mktemp)
                  if docker run --rm --env-file /run/knest/migrate.env $MOUNT "$MIGRATE_IMAGE" > "$MIGRATE_LOG" 2>&1; then cat "$MIGRATE_LOG"; else cat "$MIGRATE_LOG" >&2; echo "migration failed; the previous version keeps running" >&2; rm -f "$MIGRATE_LOG"; exit 1; fi
                  if grep -q "runtime role: ${RUNTIME_USER} .*privileges applied" "$MIGRATE_LOG"; then
                    {
                      cat /run/knest/common.env
                      echo "DATABASE_URL=postgres://${RUNTIME_USER}:$(printf '%s' "$RUNTIME_PASSWORD" | jq -sRr @uri)@${DB_ENDPOINT}:5432/knest"
                    } > /run/knest/app.env
                    echo "App identity: runtime role ${RUNTIME_USER} (no schema changes)"
                  else
                    echo "runtime role was not provisioned by this release; refusing to start the app" >&2
                    rm -f "$MIGRATE_LOG"
                    exit 1
                  fi
                  rm -f "$MIGRATE_LOG" /run/knest/migrate.env

                  echo "Starting $APP_IMAGE (previous: ${PREVIOUS:-none})"
                  docker pull "$APP_IMAGE" >/dev/null
                  docker rm -f knest >/dev/null 2>&1 || true
                  start() {
                    docker run -d --name knest --restart unless-stopped $RUN_OPTS -p "${HOST_PORT}:3000" \
                      --log-driver awslogs --log-opt "awslogs-region=$REGION" --log-opt "awslogs-group=/knest-$ENVIRONMENT" --log-opt "awslogs-stream=app-$(date +%s)" "$1" >/dev/null
                  }
                  start "$APP_IMAGE"
                  for i in $(seq 1 45); do
                    STATUS=$(docker inspect knest | jq -r '.[0].State.Health.Status // "starting"')
                    [ "$STATUS" = "healthy" ] && { echo "healthy"; rm -f /run/knest/common.env /run/knest/app.env; echo "$APP_IMAGE" > /opt/knest/current; [ -n "$PREVIOUS" ] && echo "$PREVIOUS" > /opt/knest/previous; exit 0; }
                    sleep 2
                  done
                  echo "NOT healthy after 90 s; rolling back" >&2
                  docker logs --tail 40 knest >&2 || true
                  docker rm -f knest >/dev/null 2>&1 || true
                  if [ -n "$PREVIOUS" ]; then start "$PREVIOUS" && echo "restored $PREVIOUS" >&2; fi
                  rm -f /run/knest/app.env
                  exit 1

  # ---------------------------------------------------------------- alarms
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'knest-${Environment}-alerts'
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties: { TopicArn: !Ref AlertTopic, Protocol: email, Endpoint: !Ref AlertEmail }

  # A message the outbox gave up on (src/server/email/outbox.ts logs email_outbox_dead). One is enough:
  # a person asked for a verification or reset link and did not get it.
  EmailDeadMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: email_outbox_dead
      MetricTransformations:
        - MetricNamespace: !Sub 'knest-${Environment}'
          MetricName: EmailOutboxDead
          MetricValue: '1'
          DefaultValue: 0
  EmailDeadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: At least one outgoing message was abandoned after all retries (check SES identity, sandbox and quota).
      Namespace: !Sub 'knest-${Environment}'
      MetricName: EmailOutboxDead
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  HostStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The instance failed its status checks.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{ Name: InstanceId, Value: !Ref AppInstance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Database CPU above 80 percent for 15 minutes.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertTopic]
  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Database free storage below 4 GB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 4294967296
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref AlertTopic]

  # ----------------------------------------------- document screening: alarms
  # The pipeline fails closed (a file that cannot be screened is never released), so an unhealthy pipeline shows up
  # as applicants stuck waiting. These make a person hear about it. All go to AlertTopic.
  # App log lines (src/server/security/scan-processor.ts, scan-worker.ts) that mean "a person should look":
  MalwareScanAttentionMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '?malware_scan_overdue ?malware_scan_timeout ?malware_scan_promotion_failed ?malware_scan_binding_violation ?malware_scan_event_rejected ?malware_scan_poll_failed ?malware_scan_process_failed ?malware_scan_sweep_failed'
      MetricTransformations:
        - MetricNamespace: !Sub 'knest-${Environment}'
          MetricName: MalwareScanAttention
          MetricValue: '1'
          DefaultValue: 0
  MalwareScanAttentionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The document verdict pipeline logged a problem (overdue or timed-out screening, a failed copy, a verdict that did not match its upload, an unusable event, or the worker cannot reach its queue). Applicants may be waiting.
      Namespace: !Sub 'knest-${Environment}'
      MetricName: MalwareScanAttention
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  MalwareInfectedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: malware_scan_infected
      MetricTransformations:
        - MetricNamespace: !Sub 'knest-${Environment}'
          MetricName: MalwareScanInfected
          MetricValue: '1'
          DefaultValue: 0
  MalwareInfectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: GuardDuty reported malware in an applicant upload. The file was blocked and stays unreadable in quarantine; the applicant was told. Review who uploaded it.
      Namespace: !Sub 'knest-${Environment}'
      MetricName: MalwareScanInfected
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ScanResultDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A scan result the app could not settle after repeated tries is in the dead-letter queue. Those files stay pending until they time out and fail closed.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt ScanResultDeadLetterQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  ScanResultQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The oldest scan result has waited over 15 minutes, so the app is not consuming the verdict queue (host down, permissions, or an application fault).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !GetAtt ScanResultQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GuardDutyFailedScanAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: GuardDuty could not scan an upload because of an internal error. That applicant must upload again.
      Namespace: AWS/GuardDuty/MalwareProtection
      MetricName: FailedScanCount
      Dimensions:
        - { Name: Malware Protection Plan Id, Value: !GetAtt MalwareProtectionPlan.MalwareProtectionPlanId }
        - { Name: Resource Name, Value: !Ref QuarantineBucket }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  GuardDutyMissingPermissionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: GuardDuty skipped a scan for missing permissions (its role or the key policy). Every upload will fail closed until this is fixed.
      Namespace: AWS/GuardDuty/MalwareProtection
      MetricName: SkippedScanCount
      Dimensions:
        - { Name: Malware Protection Plan Id, Value: !GetAtt MalwareProtectionPlan.MalwareProtectionPlanId }
        - { Name: Resource Name, Value: !Ref QuarantineBucket }
        - { Name: Skipped Reason, Value: MissingPermissions }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  # Cost control: scanning is billed per GB, so a day with far more scanned bytes than a cohort rush explains is worth a look.
  ScanVolumeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: More bytes were scanned in one day than expected. Check for abusive uploads before the bill does.
      Namespace: AWS/GuardDuty/MalwareProtection
      MetricName: CompletedScanBytes
      Dimensions:
        - { Name: Malware Protection Plan Id, Value: !GetAtt MalwareProtectionPlan.MalwareProtectionPlanId }
        - { Name: Resource Name, Value: !Ref QuarantineBucket }
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref ScanVolumeAlarmBytesPerDay
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  VpcId:
    Value: !Ref Vpc
  InstanceId:
    Value: !Ref AppInstance
  InstancePublicDnsName:
    Description: S-1 HTTP origin only. Production uses origin.yaml and its certified DNS name.
    Value: !GetAtt AppInstance.PublicDnsName
  PublicSubnetAId:
    Value: !Ref PublicSubnet
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  AlertTopicArn:
    Value: !Ref AlertTopic
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  BucketName:
    Value: !Ref Bucket
  OriginVerifySecretName:
    Value: !Sub 'knest-${Environment}/origin-verify'
  DeployDocumentName:
    Value: !Ref DeployDocument
  QuarantineBucketName:
    Description: Where every upload lands first. Nobody but GuardDuty can read it until a version is scanned clean.
    Value: !Ref QuarantineBucket
  DocumentsBucketName:
    Description: Clean applicant documents (versioned, five years then archived).
    Value: !Ref DocumentsBucket
  DocumentsKeyArn:
    Value: !GetAtt DocumentsKey.Arn
  MalwareProtectionPlanId:
    Value: !GetAtt MalwareProtectionPlan.MalwareProtectionPlanId
  ScanResultQueueUrl:
    Value: !Ref ScanResultQueue
  ScanResultDeadLetterQueueUrl:
    Value: !Ref ScanResultDeadLetterQueue
